services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: aic-backend

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - ./.git:/app/.git
      - ./.gitattributes:/app/.gitattributes

      # Prevent host virtual environment from
      # overriding container Python environment
      - /app/.venv

    environment:
      PYTHONUNBUFFERED: "1"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: aic-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app

      # Keep node_modules inside container
      - /app/node_modules

    environment:
      NODE_ENV: development

    depends_on:
      - backend

    restart: unless-stopped